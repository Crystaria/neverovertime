<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F9F8F6">
<title>上班摸鱼模拟器</title>
<style>
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  :root{
    --bg-outer:#E8E3D8;
    --bg-paper:#F9F8F6;
    --bg-paper2:#FFFFFF;
    --bg-soft:#F2F0EC;
    --line:#E5E5EA;
    --line-soft:#EEEDEA;
    --txt:#1C1C1E;
    --txt2:#3A3A3C;
    --txt3:#48484A;
    --dim:#8E8E93;
    --dim2:#AEAEB2;
    --yellow:#E5A93C;
    --yellow-deep:#D48806;
    --yellow-soft:#FEF6E4;
    --san:#34C759;
    --sus:#FF3B30;
    --money:#E5A93C;
    --time:#007AFF;
  }

  html,body{ height:100%; }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bg-outer);
    background-image:radial-gradient(circle at 50% 0%, #F2EEE5 0%, #E5DFD2 100%);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    color:var(--txt);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  #app{
    position:relative;
    width:100%;
    max-width:430px;
    height:100dvh;
    display:flex;
    flex-direction:column;
    background:var(--bg-paper);
    overflow:hidden;
  }
  @media (min-width:520px) and (min-height:760px){
    #app{
      height:min(880px,92vh);
      border-radius:22px;
      border:1px solid rgba(0,0,0,.06);
      box-shadow:
        0 40px 100px rgba(60,50,30,.18),
        0 4px 20px rgba(60,50,30,.08),
        0 0 0 1px rgba(255,255,255,.6) inset;
    }
  }

  /* ============ 备忘录工具栏 ============ */
  #toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px 12px;
    border-bottom:1px solid var(--line-soft);
    flex-shrink:0;
    background:var(--bg-paper);
    position:relative;
    z-index:5;
  }
  .tb-left{
    display:flex;
    align-items:center;
    gap:2px;
    color:var(--yellow-deep);
    font-size:14px;
    font-weight:400;
    letter-spacing:.01em;
    cursor:pointer;
    user-select:none;
    -webkit-user-select:none;
    padding:2px 4px;
    margin:-2px -4px;
    border-radius:6px;
    transition:background .2s ease;
  }
  .tb-left:hover{
    background:rgba(229,169,60,.06);
  }
  .tb-left:active{
    background:rgba(229,169,60,.12);
  }
  .tb-chevron{
    font-size:21px;
    line-height:1;
    margin-top:-3px;
    font-weight:300;
    pointer-events:none;
  }
  .tb-folder{
    pointer-events:none;
  }
  .tb-center{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    font-size:12px;
    color:var(--dim);
    letter-spacing:.02em;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
    pointer-events:none;
  }
  .tb-right{
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--dim);
  }
  .tb-dots{
    font-size:18px;
    line-height:1;
    color:var(--dim2);
    letter-spacing:.02em;
    user-select:none;
    padding-bottom:4px;
    pointer-events:none;
  }

  /* ============ HUD ============ */
  #hud{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    padding:14px 14px 12px;
    border-bottom:1px solid var(--line-soft);
    flex-shrink:0;
    background:var(--bg-paper);
  }
  .stat{
    background:var(--bg-paper2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:8px 8px 9px;
    transition:all .3s ease;
    overflow:hidden;
    box-shadow:0 1px 2px rgba(60,50,30,.03);
  }
  .stat.warn{
    border-color:rgba(255,59,48,.35);
    background:#FFF5F4;
  }
  .stat.warn .stat-val{ color:var(--sus); }
  .stat.danger{
    border-color:rgba(229,169,60,.55);
    background:var(--yellow-soft);
    animation:pulse 1.4s ease-in-out infinite;
  }
  .stat.danger .stat-val{ color:var(--yellow-deep); }
  @keyframes pulse{
    0%,100%{ opacity:1; }
    50%{ opacity:.75; }
  }
  .stat-head{
    display:flex;
    align-items:center;
    gap:3px;
    font-size:9.5px;
    color:var(--dim);
    letter-spacing:.05em;
    margin-bottom:4px;
    white-space:nowrap;
  }
  .stat-head span:first-child{ font-size:8px; }
  .stat-val{
    font-size:14.5px;
    font-weight:600;
    letter-spacing:-.01em;
    font-variant-numeric:tabular-nums;
    margin-bottom:6px;
    color:var(--txt);
    white-space:nowrap;
    transition:color .3s;
  }
  .bar{
    height:3px;
    border-radius:2px;
    background:rgba(0,0,0,.05);
    overflow:hidden;
  }
  .bar i{
    display:block;
    height:100%;
    width:0%;
    border-radius:2px;
    transition:width .6s cubic-bezier(.4,0,.2,1);
  }
  #bSlot{ background:var(--time); }
  #bSan{ background:var(--san); }
  #bSus{ background:var(--sus); }
  #bMoney{ background:var(--money); }

  /* ============ 剧情区 ============ */
  #stage{
    flex:1;
    min-height:0;
    overflow-y:auto;
    display:flex;
    padding:26px 24px;
    scrollbar-width:none;
    background:var(--bg-paper);
  }
  #stage::-webkit-scrollbar{ display:none; }
  .stage-inner{ margin:auto; width:100%; }

  .slot-row{
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:16px;
  }
  .slot-dot{
    width:22px;
    height:4px;
    border-radius:2px;
    background:rgba(0,0,0,.07);
    transition:background .35s, box-shadow .35s;
  }
  .slot-dot.done{ background:rgba(0,0,0,.22); }
  .slot-dot.now{
    background:var(--yellow);
    box-shadow:0 0 8px rgba(229,169,60,.4);
  }

  .clock{
    display:inline-block;
    font-size:11px;
    letter-spacing:.06em;
    color:var(--dim);
    background:var(--bg-soft);
    border:none;
    padding:4px 11px;
    border-radius:999px;
    margin-bottom:16px;
    font-variant-numeric:tabular-nums;
  }

  .evt-title{
    font-size:22px;
    font-weight:700;
    letter-spacing:-.02em;
    line-height:1.4;
    margin-bottom:14px;
    color:var(--txt);
  }

  .evt-text{
    font-size:15.5px;
    line-height:1.88;
    color:var(--txt3);
    letter-spacing:.005em;
  }

  .result-text{
    font-size:15.5px;
    line-height:1.9;
    color:var(--txt);
    letter-spacing:.005em;
  }

  .risk-badge{
    display:inline-block;
    font-size:11px;
    font-weight:600;
    letter-spacing:.06em;
    color:var(--yellow-deep);
    background:var(--yellow-soft);
    border:1px solid rgba(229,169,60,.28);
    padding:4px 11px;
    border-radius:999px;
    margin-bottom:14px;
    animation:fadeIn .3s ease both;
  }

  /* ============ 选项区 ============ */
  #choices{
    flex-shrink:0;
    padding:12px 14px calc(16px + env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
    gap:9px;
    border-top:1px solid var(--line-soft);
    background:var(--bg-paper);
  }

  .btn{
    display:block;
    width:100%;
    text-align:left;
    padding:14px 16px;
    background:var(--bg-paper2);
    border:1px solid var(--line);
    border-radius:12px;
    color:var(--txt);
    font-family:inherit;
    font-size:14.5px;
    line-height:1.55;
    letter-spacing:.005em;
    cursor:pointer;
    transition:all .18s cubic-bezier(.22,.8,.3,1);
    box-shadow:
      0 1px 2px rgba(60,50,30,.04),
      0 2px 8px rgba(60,50,30,.03);
    position:relative;
  }
  @media (hover:hover){
    .btn:hover{
      border-color:rgba(229,169,60,.45);
      box-shadow:
        0 2px 4px rgba(60,50,30,.06),
        0 6px 16px rgba(229,169,60,.12);
      transform:translateY(-1px);
    }
  }
  .btn:active{
    transform:scale(.985);
    background:#FCFBF8;
    box-shadow:0 1px 2px rgba(60,50,30,.05);
  }
  .btn-label{ display:block; }

  .btn.primary{
    text-align:center;
    font-weight:600;
    background:linear-gradient(180deg,#F8D57E 0%,#E5A93C 100%);
    border:1px solid rgba(212,136,6,.28);
    color:#5C3A00;
    letter-spacing:.03em;
    text-shadow:0 1px 1px rgba(255,255,255,.35);
    box-shadow:
      0 2px 4px rgba(212,136,6,.15),
      0 4px 14px rgba(229,169,60,.2);
  }
  @media (hover:hover){
    .btn.primary:hover{
      background:linear-gradient(180deg,#FBDD8E 0%,#E5A93C 100%);
      box-shadow:
        0 3px 6px rgba(212,136,6,.18),
        0 8px 22px rgba(229,169,60,.28);
    }
  }
  .btn.primary:active{
    background:linear-gradient(180deg,#E5A93C 0%,#D48806 100%);
    transform:scale(.985);
  }

  /* ============ 遮罩层 ============ */
  .overlay{
    position:absolute;
    inset:0;
    z-index:60;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:40px 30px calc(40px + env(safe-area-inset-bottom));
    text-align:center;
    background:var(--bg-paper);
    animation:fadeIn .45s ease both;
    overflow-y:auto;
    scrollbar-width:none;
  }
  .overlay::-webkit-scrollbar{ display:none; }
  .overlay.hidden{ display:none; }

  .intro-date{
    font-size:11px;
    letter-spacing:.16em;
    color:var(--dim);
    margin-bottom:22px;
    text-transform:uppercase;
  }
  .intro-title{
    font-size:34px;
    font-weight:700;
    letter-spacing:-.03em;
    line-height:1.25;
    margin-bottom:24px;
    color:var(--txt);
  }
  .intro-desc{
    font-size:14px;
    line-height:2.05;
    color:var(--dim);
    margin-bottom:36px;
    max-width:330px;
  }
  .intro-desc b{ color:var(--txt); font-weight:600; }

  .end-icon{
    font-size:54px;
    line-height:1;
    margin-bottom:20px;
  }
  .end-title{
    font-size:26px;
    font-weight:700;
    letter-spacing:-.02em;
    margin-bottom:16px;
    color:var(--txt);
  }
  .end-title.good{ color:#2E8B57; }
  .end-title.bad{ color:var(--sus); }
  .end-title.wild{ color:#AF52DE; }
  .end-title.gold{ color:var(--yellow-deep); }
  .end-sub{
    font-size:11px;
    letter-spacing:.16em;
    color:var(--dim2);
    margin-bottom:14px;
    text-transform:uppercase;
    font-weight:500;
  }
  .end-text{
    font-size:14px;
    line-height:1.95;
    color:var(--dim);
    margin-bottom:20px;
    max-width:340px;
  }

  .daily-list{
    width:100%;
    max-width:320px;
    margin-bottom:26px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .daily-list div{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 15px;
    background:var(--bg-paper2);
    border:1px solid var(--line);
    border-radius:11px;
    font-size:12.5px;
    box-shadow:0 1px 2px rgba(60,50,30,.03);
  }
  .daily-list div span{ color:var(--dim); }
  .daily-list div b{
    font-weight:600;
    font-variant-numeric:tabular-nums;
    font-size:14px;
    color:var(--txt);
  }
  .daily-list div b.good{ color:#2E8B57; }
  .daily-list div b.gold{ color:var(--yellow-deep); }
  .daily-list div b.sus{ color:#2E8B57; }

  .battle-card{
    width:100%;
    max-width:340px;
    background:var(--bg-paper2);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px;
    margin-bottom:26px;
    text-align:left;
    box-shadow:
      0 1px 2px rgba(60,50,30,.04),
      0 2px 10px rgba(60,50,30,.04);
  }
  .battle-card .row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:9px 0;
    border-bottom:1px dashed rgba(0,0,0,.06);
    font-size:12.5px;
  }
  .battle-card .row:last-child{ border-bottom:none; }
  .battle-card .row span{ color:var(--dim); letter-spacing:.04em; }
  .battle-card .row b{
    font-size:14px;
    font-weight:600;
    font-variant-numeric:tabular-nums;
    color:var(--txt);
    text-align:right;
  }
  .battle-card .row b.gold{ color:var(--yellow-deep); }
  .battle-card .row b.bad{ color:var(--sus); }
  .battle-card .row b.purple{ color:#AF52DE; }

  .end-actions{ width:100%; max-width:320px; }

  /* ============ 动画 ============ */
  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(9px); }
    to{ opacity:1; transform:none; }
  }
  @keyframes fadeIn{
    from{ opacity:0; }
    to{ opacity:1; }
  }
  .fade{ animation:fadeUp .42s cubic-bezier(.22,.8,.3,1) both; }

  /* ============ Debug 面板（隐藏彩蛋：5连击触发） ============ */
  #debugPanel{
    position:absolute;
    top:56px;
    left:50%;
    margin-left:-118px;
    width:236px;
    background:rgba(255,255,255,.98);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px;
    z-index:71;
    box-shadow:
      0 20px 50px rgba(60,50,30,.15),
      0 4px 14px rgba(60,50,30,.08),
      0 0 0 1px rgba(255,255,255,.5) inset;
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    animation:debugIn .22s cubic-bezier(.22,.8,.3,1) both;
    transform-origin:top center;
  }
  #debugPanel.hidden{ display:none; }

  @keyframes debugIn{
    from{ opacity:0; transform:scale(.92) translateY(-6px); }
    to{ opacity:1; transform:scale(1) translateY(0); }
  }

  .debug-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:10.5px;
    letter-spacing:.1em;
    color:var(--dim);
    margin-bottom:11px;
    padding-bottom:9px;
    border-bottom:1px solid var(--line-soft);
    text-transform:uppercase;
  }
  .debug-title em{
    font-style:normal;
    font-size:9.5px;
    color:var(--dim2);
    letter-spacing:.04em;
  }

  #debugPanel button{
    display:flex;
    align-items:center;
    gap:8px;
    width:100%;
    text-align:left;
    padding:9px 11px;
    background:var(--bg-paper2);
    border:1px solid var(--line-soft);
    border-radius:9px;
    color:var(--txt2);
    font-size:12px;
    font-family:inherit;
    line-height:1.4;
    cursor:pointer;
    margin-bottom:6px;
    transition:all .15s ease;
    letter-spacing:.01em;
  }
  #debugPanel button:last-of-type{ margin-bottom:0; }
  #debugPanel button:hover{
    background:var(--yellow-soft);
    border-color:rgba(229,169,60,.35);
    transform:translateX(1px);
  }
  #debugPanel button:active{ transform:scale(.985); }
  #debugPanel button .d-icon{
    font-size:13px;
    flex-shrink:0;
    width:16px;
    text-align:center;
  }
  #debugPanel button.day{ color:#007AFF; }
  #debugPanel button.money{ color:var(--yellow-deep); }
  #debugPanel button.fired{ color:var(--sus); }
  #debugPanel button.mad{ color:#AF52DE; }
  #debugPanel button.veteran{ color:var(--yellow-deep); }

  .debug-hint{
    font-size:9.5px;
    color:var(--dim2);
    text-align:center;
    margin-top:10px;
    letter-spacing:.04em;
  }

  /* ============ Toast ============ */
  #toast{
    position:absolute;
    bottom:110px;
    left:50%;
    transform:translateX(-50%) translateY(10px);
    background:rgba(28,28,30,.92);
    color:#FFFFFF;
    padding:9px 16px;
    border-radius:10px;
    font-size:12px;
    letter-spacing:.02em;
    z-index:80;
    opacity:0;
    transition:opacity .2s ease, transform .2s ease;
    pointer-events:none;
    white-space:nowrap;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
    font-variant-numeric:tabular-nums;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }
  #toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<div id="app">

  <!-- 备忘录工具栏 -->
  <div id="toolbar">
    <div class="tb-left" id="memoTrigger" title="备忘录">
      <span class="tb-chevron">‹</span>
      <span class="tb-folder">备忘录</span>
    </div>
    <div class="tb-center" id="tbCenter">1月6日 周一</div>
    <div class="tb-right">
      <span class="tb-dots">⋯</span>
    </div>
  </div>

  <header id="hud">
    <div class="stat" data-k="day">
      <div class="stat-head"><span>📅</span><span>Day</span></div>
      <div class="stat-val" id="vDay">1</div>
      <div class="bar"><i id="bSlot"></i></div>
    </div>
    <div class="stat" data-k="san">
      <div class="stat-head"><span>🟢</span><span>San</span></div>
      <div class="stat-val" id="vSan">60</div>
      <div class="bar"><i id="bSan"></i></div>
    </div>
    <div class="stat" data-k="sus">
      <div class="stat-head"><span>🔴</span><span>怀疑</span></div>
      <div class="stat-val" id="vSus">25%</div>
      <div class="bar"><i id="bSus"></i></div>
    </div>
    <div class="stat" data-k="money">
      <div class="stat-head"><span>💰</span><span>存款</span></div>
      <div class="stat-val" id="vMoney">3200</div>
      <div class="bar"><i id="bMoney"></i></div>
    </div>
  </header>

  <main id="stage">
    <div class="stage-inner" id="stageInner"></div>
  </main>

  <footer id="choices"></footer>

  <div class="overlay" id="intro">
    <div class="intro-date">周一 · 09:00 · 工位</div>
    <div class="intro-title">上班摸鱼<br>模拟器</div>
    <div class="intro-desc">
      你是一名普通的打工人。<br>
      每天有 <b>4 个关键时段</b>，熬过去就能打卡下班。<br>
      活过 <b>17:30</b>，工资到手、精神恢复、老板怀疑回落。<br><br>
      撑得越久，公司越离不开你——或者，越容不下你。
    </div>
    <div class="end-actions">
      <button class="btn primary" id="startBtn">开始第一天</button>
    </div>
  </div>

  <div class="overlay hidden" id="dayEnd"></div>
  <div class="overlay hidden" id="ending"></div>

  <!-- Debug 调试面板（隐藏彩蛋） -->
  <div id="debugPanel" class="hidden">
    <div class="debug-title"><span>🔧 调试控制台</span><em>DEV ONLY</em></div>
    <button class="day" data-act="addDay"><span class="d-icon">📅</span>一键天数 +5</button>
    <button class="money" data-act="addMoney"><span class="d-icon">💰</span>一键金钱 +10000</button>
    <button class="fired" data-act="maxSus"><span class="d-icon">🚪</span>怀疑度拉满（被开除）</button>
    <button class="mad" data-act="zeroSan"><span class="d-icon">🤯</span>清空 San 值（发疯结局）</button>
    <button class="veteran" data-act="jump30"><span class="d-icon">🏆</span>跳到 Day 30（光荣通关）</button>
    <div class="debug-hint">再连点 5 次备忘录可收起</div>
  </div>

  <div id="toast"></div>

</div>

<script>
(function () {
  'use strict';

  /* =========================================================
     常量
  ========================================================= */
  const SLOTS = [
    { time:'10:00', label:'上午' },
    { time:'14:00', label:'午后' },
    { time:'16:00', label:'下午' },
    { time:'17:30', label:'傍晚' }
  ];

  const DAILY_SALARY = 500;
  const VETERAN_DAY  = 30;

  // Debug 隐藏彩蛋参数
  const TAP_TARGET   = 5;     // 需要连点次数
  const TAP_TIMEOUT  = 900;   // 毫秒：超过此间隔则重置计数

  /* =========================================================
     事件库（36 个 · 单局不重复抽取）
  ========================================================= */
  const EVENTS = [
    {
      t:'外包 HR 的微信',

    if (days <= 0) return { name:'还没坐上工位就被架走的人', tag:'T-0' };
    if (days === 1) return { name:'第一天就被架走的新人', tag:'T-1' };
    if (days <= 3) return { name:'三天试用期都没撑过的实习生', tag:'T-2' };
    if (days <= 7) return { name:'有点东西的职场新晋老油条', tag:'T-3' };
    if (days <= 14) return { name:'潜伏一周半的资深摸鱼专员', tag:'T-4' };
    if (days <= 29) return { name:'半个月没被发现的老江湖', tag:'T-5' };
    if (days <= 59) return { name:'白嫖一个月的摸鱼大师', tag:'T-6' };
    if (days <= 99) return { name:'白嫖两个月的摸鱼宗师', tag:'T-7' };
    return { name:'白嫖数万元的摸鱼成仙者', tag:'T-∞' };
  }

  /* =========================================================
     状态
  ========================================================= */
  const state = {
    day: 1,
    slot: 0,
    san: 60,
    sus: 25,
    money: 3200,
    over: false,
    locked: false
  };

  let pool = [];
  let toastTimer = null;

  /* =========================================================
     DOM
  ========================================================= */
  const $ = function (id) { return document.getElementById(id); };
  const stageInner = $('stageInner');
  const choicesEl = $('choices');
  const introEl = $('intro');
  const dayEndEl = $('dayEnd');
  const endingEl = $('ending');
  const debugPanel = $('debugPanel');
  const tbCenter = $('tbCenter');
  const memoTrigger = $('memoTrigger');

  /* =========================================================
     工具
  ========================================================= */
  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function slotDotsHTML() {
    let html = '<div class="slot-row">';
    for (let i = 0; i < 4; i++) {
      let cls = 'slot-dot';
      if (i < state.slot) cls += ' done';
      else if (i === state.slot) cls += ' now';
      html += '<span class="' + cls + '"></span>';
    }
    html += '</div>';
    return html;
  }

  function toast(msg) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      el.classList.remove('show');
    }, 1600);
  }

  /* =========================================================
     HUD
  ========================================================= */
  function renderHUD() {
    $('vDay').textContent = state.day;
    $('vSan').textContent = Math.round(state.san);
    $('vSus').textContent = Math.round(state.sus) + '%';
    $('vMoney').textContent = state.money;

    $('bSlot').style.width = clamp(state.slot / 4 * 100, 0, 100) + '%';
    $('bSan').style.width = clamp(state.san, 0, 100) + '%';
    $('bSus').style.width = clamp(state.sus, 0, 100) + '%';
    $('bMoney').style.width = clamp(state.money / 50000 * 100, 0, 100) + '%';

    document.querySelector('.stat[data-k="sus"]').classList.toggle('warn', state.sus >= 72);
    document.querySelector('.stat[data-k="san"]').classList.toggle('danger', state.san <= 22);

    // 备忘录工具栏日期（随天数递增）
    if (tbCenter) {
      const baseDate = new Date(2024, 0, 6);
      baseDate.setDate(baseDate.getDate() + (state.day - 1));
      const weekdays = ['周日','周一','周二','周三','周四','周五','周六'];
      tbCenter.textContent = (baseDate.getMonth() + 1) + '月' + baseDate.getDate() + '日 ' + weekdays[baseDate.getDay()];
    }
  }

  /* =========================================================
     数值结算
  ========================================================= */
  function applyEffect(eff) {
    if (!eff) return;
    if (eff.san) state.san = clamp(state.san + eff.san, 0, 100);
    if (eff.sus) state.sus = clamp(state.sus + eff.sus, 0, 100);
    if (eff.money) state.money = Math.max(0, state.money + eff.money);
  }

  function tickSlot() {
    const rise = 4 + Math.floor((state.day - 1) / 3);
    state.sus = clamp(state.sus + rise, 0, 100);
    state.san = clamp(state.san - 3, 0, 100);
  }

  /* =========================================================
     抽事件
  ========================================================= */
  function drawEvent() {
    if (pool.length === 0) pool = shuffle(EVENTS.slice());
    return pool.pop();
  }

  /* =========================================================
     渲染事件
  ========================================================= */
  function renderEvent(ev) {
    const slot = SLOTS[state.slot];

    stageInner.innerHTML =
      slotDotsHTML() +
      '<div class="clock fade">Day ' + state.day + ' · ' + slot.time + ' · ' + slot.label + '</div>' +
      '<h1 class="evt-title fade" style="animation-delay:.05s">' + ev.t + '</h1>' +
      '<p class="evt-text fade" style="animation-delay:.1s">' + ev.s + '</p>';

    choicesEl.innerHTML = '';

    ev.c.forEach(function (choice, i) {
      const btn = document.createElement('button');
      btn.className = 'btn fade';
      btn.style.animationDelay = (0.14 + i * 0.06) + 's';
      btn.innerHTML = '<span class="btn-label">' + choice.l + '</span>';
      btn.addEventListener('click', function () { pick(choice); });
      choicesEl.appendChild(btn);
    });

    state.locked = false;
  }

  /* =========================================================
     渲染结果
  ========================================================= */
  function renderResult(text, risked, finishedSlot) {
    const slot = finishedSlot;

    stageInner.innerHTML =
      slotDotsHTML() +
      (risked ? '<div class="risk-badge">⚡ 意外发生</div>' : '') +
      '<div class="clock fade">Day ' + state.day + ' · ' + slot.time + ' · 刚刚</div>' +
      '<p class="result-text fade" style="animation-delay:.05s">' + text + '</p>';

    choicesEl.innerHTML = '';

    const isLastSlot = state.slot >= 4;
    const btn = document.createElement('button');
    btn.className = 'btn primary fade';
    btn.style.animationDelay = '.18s';
    btn.textContent = isLastSlot ? '打卡下班 →' : '继续摸鱼 →';
    btn.addEventListener('click', function () {
      if (state.locked) return;
      state.locked = true;
      advance();
    });
    choicesEl.appendChild(btn);

    state.locked = false;
  }

  /* =========================================================
     玩家选择
  ========================================================= */
  function pick(choice) {
    if (state.over || state.locked) return;
    state.locked = true;

    const finishedSlot = SLOTS[state.slot];

    let eff = choice.e || {};
    let res = choice.r || '';
    let risked = false;

    if (choice.risk && Math.random() < choice.risk.p) {
      eff = choice.risk.e;
      res = choice.risk.r;
      risked = true;
    }

    applyEffect(eff);
    tickSlot();
    state.slot += 1;

    renderResult(res, risked, finishedSlot);

    setTimeout(function () { renderHUD(); }, 420);
  }

  /* =========================================================
     推进
  ========================================================= */
  function advance() {
    if (state.sus >= 100) { showEnding('fired'); return; }
    if (state.san <= 0)   { showEnding('mad');   return; }
    if (state.day >= VETERAN_DAY) { showEnding('veteran'); return; }

    if (state.slot >= 4) {
      showDayEnd();
      return;
    }

    renderEvent(drawEvent());
  }

  /* =========================================================
     日结
  ========================================================= */
  function showDayEnd() {
    const heal  = Math.max(6, 20 - Math.floor((state.day - 1) / 2));
    const decay = Math.max(6, 18 - Math.floor((state.day - 1) / 3));

    const oldSan = Math.round(state.san);
    const oldSus = Math.round(state.sus);

    state.san = clamp(state.san + heal, 0, 100);
    state.sus = clamp(state.sus - decay, 0, 100);
    state.money += DAILY_SALARY;

    const sanGain = Math.round(state.san) - oldSan;
    const susDrop = oldSus - Math.round(state.sus);

    renderHUD();

    const isMilestone = state.day % 5 === 0;

    dayEndEl.innerHTML =
      '<div class="end-sub">Day ' + state.day + ' · 17:30</div>' +
      '<div class="end-icon fade">🌇</div>' +
      '<div class="end-title good fade" style="animation-delay:.06s">打卡下班！</div>' +
      '<div class="end-text fade" style="animation-delay:.12s">恭喜你熬过第 ' + state.day + ' 天。' +
        (isMilestone ? '<br><span style="color:#D48806;font-weight:600">（连续作战 ' + state.day + ' 天，你已经是个老兵了）</span>' : '') +
      '</div>' +
      '<div class="daily-list fade" style="animation-delay:.18s">' +
        '<div><span>💼 当日底薪入账</span><b class="gold">+¥' + DAILY_SALARY + '</b></div>' +
        '<div><span>🟢 San 值恢复</span><b class="good">+' + sanGain + '</b></div>' +
        '<div><span>🔴 老板怀疑回落</span><b class="sus">−' + susDrop + '</b></div>' +
        '<div><span>💰 当前存款</span><b class="gold">¥' + state.money + '</b></div>' +
      '</div>' +
      '<div class="end-actions fade" style="animation-delay:.24s">' +
        '<button class="btn primary" id="nextDayBtn">开始新的一天 →</button>' +
      '</div>';

    dayEndEl.classList.remove('hidden');

    $('nextDayBtn').addEventListener('click', function () {
      dayEndEl.classList.add('hidden');
      state.day += 1;

      if (state.day >= VETERAN_DAY) {
        showEnding('veteran');
        return;
      }

      state.slot = 0;
      state.locked = false;
      renderHUD();
      renderEvent(drawEvent());
    });
  }

  /* =========================================================
     终极结局
  ========================================================= */
  function showEnding(type) {
    state.over = true;

    let days, icon, titleText, tone, text, cause, causeExtra;

    if (type === 'veteran') {
      days = 30;
      icon = '🏆';
      titleText = '光荣通关 · 摸鱼老兵';
      tone = 'gold';
      text = '你在这家公司活过了 30 天。部门换了 3 个方向，老板换了 2 种管理风格，而你依然安静地、熟练地、不动声色地坐在那个工位上。他们说你是个老油条——你觉得这是一种赞美。';
      cause = '光荣退伍 · 存活满 ' + days + ' 天';
      causeExtra = '称号达成 · 摸鱼成仙者';
    } else {
      days = Math.max(0, state.day - 1);

      if (type === 'fired') {
        icon = '🚪';
        titleText = '终极战报 · 被开除';
        tone = 'bad';
        text = 'HR 拿着那份《员工行为观察记录》走过来，眼神里甚至带点同情。她知道你其实没做错什么，只是这家公司不需要一个活人。';
        cause = '怀疑度爆表 · 被 HR 请进会议室';
        causeExtra = '最终怀疑度 ' + Math.round(state.sus) + '%';
      } else {
        icon = '🤯';
        titleText = '终极战报 · 工位发疯';
        tone = 'wild';
        text = '你忽然站起来，把键盘举过头顶，用整个办公室都能听见的声音说：“我受够了。”然后你轻轻把它放下，坐回去，像什么都没发生。当天下午你被送去做心理疏导。';
        cause = 'San 值归零 · 当场精神崩溃';
        causeExtra = '最终 San 值 0';
      }
    }

    const salaryStolen = days * DAILY_SALARY;
    const title = getTitle(days);

    endingEl.innerHTML =
      '<div class="end-sub">SURVIVAL REPORT</div>' +
      '<div class="end-icon fade">' + icon + '</div>' +
      '<div class="end-title ' + tone + ' fade" style="animation-delay:.06s">' + titleText + '</div>' +
      '<div class="end-text fade" style="animation-delay:.12s">' + text + '</div>' +
      '<div class="battle-card fade" style="animation-delay:.18s">' +
        '<div class="row"><span>在此公司白嫖</span><b class="purple">' + (days > 0 ? days + ' 天' : '不到 1 天') + '</b></div>' +
        '<div class="row"><span>累计摸走工资</span><b class="gold">¥' + salaryStolen + '</b></div>' +
        '<div class="row"><span>最终职场称号</span><b class="purple">' + title.name + '</b></div>' +
        '<div class="row"><span>评级代号</span><b>' + title.tag + '</b></div>' +
        '<div class="row"><span>直接死因</span><b class="bad">' + cause + '</b></div>' +
        '<div class="row"><span>遗言状态</span><b>' + causeExtra + '</b></div>' +
        '<div class="row"><span>存款余额</span><b class="gold">¥' + state.money + '</b></div>' +
      '</div>' +
      '<div class="end-actions fade" style="animation-delay:.26s">' +
        '<button class="btn primary" id="restartBtn">从 Day 1 重新开始</button>' +
      '</div>';

    endingEl.classList.remove('hidden');

    $('restartBtn').addEventListener('click', function () {
      endingEl.classList.add('hidden');
      startGame();
    });
  }

  /* =========================================================
     开局
  ========================================================= */
  function startGame() {
    state.day = 1;
    state.slot = 0;
    state.san = 60;
    state.sus = 25;
    state.money = 3200;
    state.over = false;
    state.locked = false;

    pool = shuffle(EVENTS.slice());

    dayEndEl.classList.add('hidden');
    endingEl.classList.add('hidden');

    renderHUD();
    renderEvent(drawEvent());
  }

  $('startBtn').addEventListener('click', function () {
    introEl.classList.add('hidden');
    startGame();
  });

  /* =========================================================
     🥚 隐藏彩蛋：连点「备忘录」5 次开启 Debug
  ========================================================= */
  let tapCount = 0;
  let lastTapTime = 0;

  memoTrigger.addEventListener('click', function (e) {
    e.stopPropagation();
    const now = Date.now();

    // 超过设定间隔则重置连击
    if (now - lastTapTime > TAP_TIMEOUT) {
      tapCount = 0;
    }
    tapCount++;
    lastTapTime = now;

    // 未到 5 次时，给一点点微妙反馈（可选）
    if (tapCount > 1 && tapCount < TAP_TARGET) {
      // 静默计数，不给提示——保持隐蔽性
    }

    if (tapCount >= TAP_TARGET) {
      tapCount = 0;
      lastTapTime = 0;
      const willShow = debugPanel.classList.contains('hidden');
      debugPanel.classList.toggle('hidden');
      if (willShow) {
        toast('🔧 调试模式已开启');
      } else {
        toast('调试模式已关闭');
      }
    }
  });

  // 点击 Debug 面板里的按钮
  debugPanel.querySelectorAll('button[data-act]').forEach(function (btn) {
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      handleDebug(btn.dataset.act);
    });
  });

  // 点击面板外区域收起
  document.addEventListener('click', function (e) {
    if (debugPanel.classList.contains('hidden')) return;
    if (debugPanel.contains(e.target) || memoTrigger.contains(e.target)) return;
    debugPanel.classList.add('hidden');
  });

  function handleDebug(act) {
    dayEndEl.classList.add('hidden');
    endingEl.classList.add('hidden');
    state.over = false;
    state.locked = false;

    if (act === 'addDay') {
      state.day += 5;
      renderHUD();
      toast('📅 天数 +5 → 现在是 Day ' + state.day);

    } else if (act === 'addMoney') {
      state.money += 10000;
      renderHUD();
      toast('💰 存款 +¥10000 → 现在 ¥' + state.money);

    } else if (act === 'maxSus') {
      state.sus = 100;
      renderHUD();
      toast('🔴 怀疑度已拉满 · 触发被开除结局');
      setTimeout(function () { showEnding('fired'); }, 260);

    } else if (act === 'zeroSan') {
      state.san = 0;
      renderHUD();
      toast('🟢 San 值清零 · 触发工位发疯结局');
      setTimeout(function () { showEnding('mad'); }, 260);

    } else if (act === 'jump30') {
      state.day = 30;
      state.money += DAILY_SALARY * 29;
      renderHUD();
      toast('🏆 已跳转 Day 30 · 触发光荣通关结局');
      setTimeout(function () { showEnding('veteran'); }, 300);
    }
  }

  // 初始化
  renderHUD();

})();
</script>
</body>
</html>
